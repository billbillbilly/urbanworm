site_name: UrbanWorm
site_url: https://billbillbilly.github.io/urbanworm/
repo_url: https://github.com/billbillbilly/urbanworm
repo_name: GitHub
site_description: >-
  Workflow of Reproducible Multimodal Inference — collect geo-referenced
  street views, photos, and audio near building footprints; label them with
  local or cloud VLMs; export structured datasets.
copyright: Copyright &copy; 2026 Xiaohao Yang

theme:
  name: material
  custom_dir: overrides
  logo: images/urabn_worm_logo2.png
  favicon: images/urabn_worm_logo2.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Auto light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: green
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # Auto dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: purple
      accent: green
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - autorefs
  - git-revision-date-localized:
      enable_creation_date: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            merge_init_into_class: true
  - mkdocs-jupyter:
      execute: false
      include_source: true
      kernel_name: python3

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Tutorials:
      - Colab Demo: example_colab.ipynb
      - Basic Inference: 1_basic_inference.ipynb
      - Geo-Located Data: 2_inference_geo_located_data.ipynb
      - Full Workflow: 3_full_workflow.ipynb
  - API Reference:
      - Dataset: api/dataset.md
      - Inference: api/inference.md
      - Sources: api/sources.md
  - Changelog: changelog.md
